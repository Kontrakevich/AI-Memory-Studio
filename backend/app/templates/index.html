<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <div class="eyebrow">MARINS · 1 SEPTEMBER</div>
        <h1>{{ title }}</h1>
        <p>Две фотографии → identity passport → эпохи 1970–2020 → единая верстка → meeting anchor → Seedance 2.0.</p>
      </div>
      <div class="header-actions">
        <button class="secondary" onclick="loadHealth()">API статус</button>
        <button class="secondary" onclick="loadProjects()">Обновить</button>
      </div>
    </header>

    <section class="card compact">
      <div id="health" class="health-row">Проверка API...</div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Новый человек</h2>
        <form id="project-form">
          <label>Название проекта<input name="project_name" value="1 сентября 2026" required /></label>
          <div class="grid two tight">
            <label>Фамилия<input name="surname" required /></label>
            <label>Имя<input name="name" required /></label>
          </div>
          <label>Должность<input name="position" required /></label>
          <label>Годы обучения<input name="school_years" placeholder="1993–2003" required /></label>
          <label>Дополнительное описание<textarea name="notes" rows="3" placeholder="Особенности образа, пожелания по эпохе"></textarea></label>
          <label>Школьное фото<input type="file" name="child_file" accept="image/*" required /></label>
          <label>Актуальное фото<input type="file" name="adult_file" accept="image/*" required /></label>
          <button type="submit">Создать проект</button>
        </form>
        <div id="create-status" class="status"></div>
      </div>

      <div class="card">
        <h2>Проекты</h2>
        <p class="hint">Нажми на проект, чтобы выбрать его для генерации.</p>
        <div id="projects" class="project-list"></div>
      </div>
    </section>

    <section class="card">
      <h2>Production pipeline</h2>
      <div class="grid two">
        <label>ID проекта<input id="gen-project-id" placeholder="Выбери проект справа" /></label>
        <label>Генератор master-фото
          <select id="image-provider">
            <option value="seedream" selected>Seedream / Ark — production path</option>
            <option value="nano_banana">Nano Banana / OpenRouter — identity-first</option>
          </select>
        </label>
        <label>Видео
          <select id="video-provider">
            <option value="seedance" selected>Seedance 2.0 / Ark</option>
          </select>
        </label>
        <label>Десятилетия
          <input id="decades" value="1970s,1980s,1990s,2000s,2010s,2020s" />
        </label>
      </div>
      <div class="actions-row">
        <button onclick="startGeneration()">Запустить весь pipeline</button>
        <button class="secondary" onclick="refreshSelectedProject()">Статус проекта</button>
        <button class="secondary" onclick="refreshVideoStatus()">Проверить Seedance / MP4</button>
      </div>
      <pre id="generation-output">Готов к запуску.</pre>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
